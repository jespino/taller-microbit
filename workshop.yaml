# Everything about the workshop that is not module content.

title: "Taller de Programación con micro:bit"
short_title: "Taller micro:bit"
description: "Aprende a programar de forma divertida con bloques visuales: luces, botones, sensores, música y tu propio juego. Para niños de 8 a 12 años."

# Where the site is published. Needed for canonical URLs and the sitemap.
url: https://jespino.github.io/taller-microbit/

# Enables the repository links, and links from modules to other repository files.
repository: https://github.com/jespino/taller-microbit
branch: main

image: images/portada.png   # social sharing image, inside modules/images/

author:
  name: "Jesús Espino"
